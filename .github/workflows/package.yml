name: Package (Linux/Windows/macOS)

# Builds the Navalha 2 JUCE shell and packages it on each of GitHub's own
# hosted runners - real Windows and macOS toolchains, no Windows or macOS
# machine needed by the author or by whoever runs this. Linux (.deb) was
# already validated by this workflow's previous single-platform version;
# Windows (NSIS/.exe) and macOS (DragNDrop/.dmg) are new here.
#
# Since 6 Oct. 2026 it follows the RASGO multiplatform distribution
# standard (RASGO_DOCUMENTATION/PADRAO_DISTRIBUICAO_MULTIPLATAFORMA.md in
# the monorepo), born from Rasgo Modular v0.1.4:
#   - Windows: static VC++ runtime (CMakeLists.txt) + a step that FAILS if
#     the .exe depends on the VC++ Redistributable again (v0.1.0 did, and
#     does not open on a Windows without it); NSIS installer + portable .zip.
#   - macOS: the whole .app sealed ad-hoc, both slices checked (v0.1.0 was
#     unsealed, only the linker's arm64 signature).
#   - Linux: AppImage and .tar.gz besides the .deb, all launch-tested in
#     containers of Debian 12, Ubuntu 24.04, Fedora and Arch.
#   - A GitHub release is created from `v*` tags (hyphen = pre-release),
#     only after the launch tests pass.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # explicit name: the default would include the Linux list of globs
    name: package (${{ matrix.os }}, ${{ matrix.generator }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            generator: DEB
            artifact-glob: |
              dist/*.deb
              dist/*.AppImage
              dist/*.tar.gz
          - os: windows-latest
            generator: NSIS
            artifact-glob: |
              dist/*.exe
              dist/*.zip
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Navalha 2 JUCE
        uses: actions/checkout@v5

      - name: Check out JUCE 8.0.13
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.13
          path: JUCE

      # Windows (MSVC) and macOS (Xcode) runners already ship everything
      # JUCE needs; only Linux requires explicit dev packages.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake g++ ninja-build pkg-config dpkg-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxi-dev

      # makensis is not on the Windows runner's PATH by default; Chocolatey
      # is preinstalled there, so this is a one-line fix (same fix already
      # proven on the Antitotem instrument's own multiplatform workflow).
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNAVALHA_JUCE_PATH=${{ github.workspace }}/JUCE
          -DNAVALHA_ENABLE_WEBVIEW=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test (Linux only - the headless guard test only runs there)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # No Mac available to test by hand (26 ago. 2026), so this replaces
      # that: fails the build if the .app isn't actually distributable -
      # catches the exact bug found live that day (single-arch arm64-only
      # binary, deployment target silently defaulting to the runner's own
      # macOS version) before it ever reaches a release asset again.
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 6 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          EXE="$APP/Contents/MacOS/Navalha 2"

          echo "--- file (architecture) ---"
          file "$EXE"
          if ! file "$EXE" | grep -q "Mach-O universal binary with 2 architectures"; then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Missing x86_64 or arm64 slice"; exit 1
          fi

          echo "--- otool -l (deployment target) ---"
          otool -l "$EXE" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          case "$MINOS" in
            10.13*|10.1[4-9]*|10.[2-9]*|1[1-9].*|[2-9][0-9].*) ;;
            *) echo "::error::Unexpected minos $MINOS (expected >= 10.13)"; exit 1 ;;
          esac
          if [[ "$MINOS" == 2[0-9].* ]]; then
            echo "::error::minos $MINOS looks like it defaulted to the runner's own macOS version, not the project's deployment target"
            exit 1
          fi

          echo "--- plutil (Info.plist) ---"
          plutil -p "$APP/Contents/Info.plist"

          echo "--- codesign (ad-hoc; no Developer ID/notarization in CI) ---"
          # Seal the WHOLE bundle ad-hoc, both slices. Unsealed (v0.1.0: only
          # the linker's arm64 signature) an Apple Silicon Mac tends to say
          # "is damaged and can't be opened"; sealed, it is the ordinary
          # unidentified-developer warning, which the user can clear in
          # System Settings -> Privacy & Security -> "Open Anyway".
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for arch in x86_64 arm64; do
            codesign -dv --arch "$arch" "$APP" 2>&1 | grep -q "Signature=adhoc" \
              || { echo "::error::$arch slice without ad-hoc signature"; exit 1; }
          done
          test -d "$APP/Contents/_CodeSignature" || { echo "::error::bundle not sealed"; exit 1; }
          echo "ok: bundle sealed, both slices signed (ad-hoc)"

      # The .exe must not depend on the Visual C++ Redistributable (v0.1.0
      # did; this runner has the package, so a launch here never notices).
      - name: Validate Windows runtime (static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter 'Navalha 2.exe' |
                 Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Navalha 2.exe not found' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $deps = & $dumpbin.FullName /dependents $exe.FullName
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt'
          if ($bad) { Write-Error "the .exe depends on the dynamic Visual C++ runtime: $bad"; exit 1 }
          "ok: no dependency on the Visual C++ Redistributable"

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.generator }} -C Release -B ../dist

      # Cada atalho do instalador precisa apontar para um arquivo que o
      # instalador de fato põe lá. Sem CPACK_NSIS_EXECUTABLES_DIRECTORY o
      # CPack apontava o Menu Iniciar para bin\, que não existe: o app
      # abria pela pasta e não pelo menu (Windows 10 real, 7 out. 2026).
      - name: Conferir os atalhos do instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsi = Get-ChildItem -Recurse -Path . -Filter project.nsi | Select-Object -First 1
          if (-not $nsi) { throw 'project.nsi não encontrado' }
          $stage = Get-ChildItem -Directory $nsi.DirectoryName | Select-Object -First 1
          if (-not $stage) { throw 'pasta de instalação do CPack não encontrada' }
          $txt = Get-Content -Raw $nsi.FullName
          $alvos = @()
          $alvos += [regex]::Matches($txt, 'CreateShortCut\s+"[^"]+"\s+"\$INSTDIR\\([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          $alvos += [regex]::Matches($txt, 'MUI_FINISHPAGE_RUN\s+"\$INSTDIR\\([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          $alvos = $alvos | Where-Object { $_ -notmatch 'Uninstall' } | Sort-Object -Unique
          if (-not $alvos) { Write-Error 'nenhum atalho para o programa no instalador'; exit 1 }
          $falta = $false
          foreach ($a in $alvos) {
            $p = Join-Path $stage.FullName $a
            if (Test-Path -LiteralPath $p) { "ok: $a" } else { Write-Error "atalho aponta para arquivo inexistente: $a"; $falta = $true }
          }
          # Pasta de instalação e chave de registro sem a versão: senão a
          # versão nova não acha a anterior e as duas ficam instaladas.
          $ver = [regex]::Match($txt, '!define VERSION "([^"]+)"').Groups[1].Value
          $dir = [regex]::Match($txt, '(?m)^\s*InstallDir\s+(.+)$').Groups[1].Value
          $reg = [regex]::Match($txt, 'CurrentVersion\\Uninstall\\([^"]+)"').Groups[1].Value
          "versão: $ver · InstallDir: $dir · chave: $reg"
          if (-not $ver -or -not $dir -or -not $reg) { Write-Error 'não achei VERSION, InstallDir ou a chave de desinstalação no project.nsi'; exit 1 }
          if ($dir.Contains($ver) -or $reg.Contains($ver)) { Write-Error 'a pasta ou a chave de registro leva a versão: versões vão se acumular'; $falta = $true }
          if ($falta) { exit 1 }

      - name: Portable .zip (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: cpack -G ZIP -C Release -B ../dist

      - name: AppImage and .tar.gz (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/empacotar.sh build dist navalha2

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: navalha2-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  # ---- launch test: do the Linux packages open on other distributions? ----
  # Each container installs only what an ordinary desktop already has, opens
  # the app on a virtual screen without a sound card, and checks that it is
  # still running after 20 s and that its window exists.
  arranque-linux:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the Linux packages
        uses: actions/download-artifact@v5
        with:
          name: navalha2-ubuntu-22.04
          path: pkgs

      - name: Install an ordinary desktop's basics (and the .deb where it fits)
        run: |
          set -eux
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./pkgs/*.deb
              apt-get install -y xvfb x11-utils libx11-6 libxext6 libxrandr2 \
                libxcursor1 libxinerama1 libxrender1 libgl1 fonts-dejavu-core ;;
            fedora:*)
              dnf install -y xorg-x11-server-Xvfb xwininfo alsa-lib freetype fontconfig \
                libX11 libXext libXrandr libXcursor libXinerama libXrender mesa-libGL dejavu-sans-fonts ;;
            archlinux:*)
              pacman -Syu --noconfirm xorg-server-xvfb xorg-xwininfo alsa-lib freetype2 fontconfig \
                libx11 libxext libxrandr libxcursor libxinerama libxrender mesa ttf-dejavu ;;
          esac

      - name: Open the installed .deb
        if: startsWith(matrix.image, 'debian') || startsWith(matrix.image, 'ubuntu')
        run: packaging/linux/testar-arranque.sh "/usr/bin/Navalha 2" "Navalha 2"

      - name: Open the AppImage
        run: |
          chmod +x pkgs/*.AppImage
          packaging/linux/testar-arranque.sh "$(ls pkgs/*.AppImage)" "Navalha 2"

      - name: Open the .tar.gz
        run: |
          mkdir tgz && tar -xzf pkgs/*.tar.gz -C tgz
          packaging/linux/testar-arranque.sh "$(ls tgz/*/bin/*)" "Navalha 2"

  # ---- release: where a tag becomes something a musician can download ----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, arranque-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v5
        with:
          path: pkgs

      - name: Check what arrived
        run: |
          find pkgs -type f -print
          for ext in deb AppImage tar.gz dmg exe zip; do
            if ! find pkgs -type f -name "*.$ext" | grep -q .; then
              echo "::error::no .$ext package among the artifacts"
              exit 1
            fi
          done

      - name: Create the release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ${PRE} \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Navalha 2 JUCE ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "**Install:** step by step for Windows, macOS and each Linux distribution in [docs/INSTALLATION.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALLATION.md#installing-step-by-step) — on first launch Windows and macOS show a security warning; it is expected and the guide says where to click. Linux: \`.deb\` for Ubuntu/Debian/Mint, AppImage or \`.tar.gz\` for other distributions (launch-tested on Debian 12, Ubuntu 24.04, Fedora and Arch).

          **Stated limitation:** the Windows and macOS packages were built, packaged and checked by continuous integration (no dependency on the Visual C++ Redistributable; macOS bundle sealed, Universal 2) — not yet opened by the author on real Windows/macOS machines. The macOS package is ad-hoc signed, without Developer ID or notarisation.

          ---

          **Instalação:** passo a passo para Windows, macOS e cada distribuição Linux em [docs/INSTALLATION.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALLATION.md#instalar-passo-a-passo) — na primeira abertura, Windows e macOS mostram um aviso de segurança; é esperado, e o guia diz onde clicar.

          **Limitação declarada:** os pacotes de Windows e macOS foram construídos, empacotados e conferidos pela integração contínua — ainda não abertos pelo autor em máquinas reais." \
            $(find pkgs -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \))
