name: Package (Linux/Windows/macOS)

# Builds the Navalha 2 JUCE shell and packages it on each of GitHub's own
# hosted runners - real Windows and macOS toolchains, no Windows or macOS
# machine needed by the author or by whoever runs this. Linux (.deb) was
# already validated by this workflow's previous single-platform version;
# Windows (NSIS/.exe) and macOS (DragNDrop/.dmg) are new here.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            generator: DEB
            artifact-glob: dist/*.deb
          - os: windows-latest
            generator: NSIS
            artifact-glob: dist/*.exe
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Navalha 2 JUCE
        uses: actions/checkout@v5

      - name: Check out Pure Data reference assets
        uses: actions/checkout@v5
        with:
          repository: lucioaraujo/navalha2-pd
          path: navalha2-pd

      - name: Check out JUCE 8.0.13
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.13
          path: JUCE

      # Windows (MSVC) and macOS (Xcode) runners already ship everything
      # JUCE needs; only Linux requires explicit dev packages.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake g++ ninja-build pkg-config dpkg-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxi-dev

      # makensis is not on the Windows runner's PATH by default; Chocolatey
      # is preinstalled there, so this is a one-line fix (same fix already
      # proven on the Antitotem instrument's own multiplatform workflow).
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNAVALHA_JUCE_PATH=${{ github.workspace }}/JUCE
          -DNAVALHA_PD_PATH=${{ github.workspace }}/navalha2-pd
          -DNAVALHA_ENABLE_WEBVIEW=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test (Linux only - the headless guard test only runs there)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # No Mac available to test by hand (26 ago. 2026), so this replaces
      # that: fails the build if the .app isn't actually distributable -
      # catches the exact bug found live that day (single-arch arm64-only
      # binary, deployment target silently defaulting to the runner's own
      # macOS version) before it ever reaches a release asset again.
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 4 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          EXE="$APP/Contents/MacOS/Navalha 2"

          echo "--- file (architecture) ---"
          file "$EXE"
          if ! file "$EXE" | grep -q "Mach-O universal binary with 2 architectures"; then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Missing x86_64 or arm64 slice"; exit 1
          fi

          echo "--- otool -l (deployment target) ---"
          otool -l "$EXE" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          case "$MINOS" in
            10.13*|10.1[4-9]*|10.[2-9]*|1[1-9].*|[2-9][0-9].*) ;;
            *) echo "::error::Unexpected minos $MINOS (expected >= 10.13)"; exit 1 ;;
          esac
          if [[ "$MINOS" == 2[0-9].* ]]; then
            echo "::error::minos $MINOS looks like it defaulted to the runner's own macOS version, not the project's deployment target"
            exit 1
          fi

          echo "--- plutil (Info.plist) ---"
          plutil -p "$APP/Contents/Info.plist"

          echo "--- codesign (ad-hoc; no Developer ID/notarization in CI) ---"
          codesign -dv "$APP" 2>&1 || echo "::warning::Not signed - fine for local testing, but real distribution needs a Developer ID + notarization or Gatekeeper will show an unidentified-developer warning on first launch"

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.generator }} -C Release -B ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: navalha2-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
