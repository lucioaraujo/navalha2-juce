<!doctype html>
<meta charset="utf-8">
<title>Navalha 2 WebAudio MASTER reference</title>
<pre id="result">PENDING</pre>
<script>
const fixture="../../validation-output/recordings/NAVALHA_2026-07-29_17-14-37.wav";
const keepAlive=setInterval(()=>document.body.dataset.waiting=String(performance.now()),50);
const db=x=>20*Math.log10(Math.max(1e-12,x));
function curve(amount){const n=65536,a=1+amount*24,out=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/(n-1)-1;out[i]=Math.tanh(a*x)/Math.tanh(a);}return out;}
function metrics(buffer){let peak=0,sum=0,n=0,cross=0,l2=0,r2=0;const L=buffer.getChannelData(0),R=buffer.numberOfChannels>1?buffer.getChannelData(1):L;for(let i=0;i<L.length;i++){const l=L[i],r=R[i];peak=Math.max(peak,Math.abs(l),Math.abs(r));sum+=(l*l+r*r)/2;cross+=l*r;l2+=l*l;r2+=r*r;n++;}const rms=Math.sqrt(sum/Math.max(1,n));return{frames:L.length,sampleRate:buffer.sampleRate,peak,peakDb:db(peak),rms,rmsDb:db(rms),lufs:-.691+10*Math.log10(Math.max(1e-12,sum/Math.max(1,n))),crest:db(peak)-db(rms),correlation:cross/Math.sqrt(Math.max(1e-12,l2*r2))};}
function decodeWav(raw){const v=new DataView(raw),text=(o,n)=>String.fromCharCode(...new Uint8Array(raw,o,n));if(text(0,4)!=="RIFF"||text(8,4)!=="WAVE")throw Error("not RIFF/WAVE");let o=12,fmt=null,data=null;while(o+8<=v.byteLength){const id=text(o,4),n=v.getUint32(o+4,true),p=o+8;if(id==="fmt ")fmt={format:v.getUint16(p,true),channels:v.getUint16(p+2,true),rate:v.getUint32(p+4,true),bits:v.getUint16(p+14,true)};if(id==="data")data={offset:p,size:n};o=p+n+(n&1);}if(!fmt||!data||fmt.channels<1||fmt.channels>2)throw Error("unsupported WAV");const bytes=fmt.bits/8,frames=Math.floor(data.size/(bytes*fmt.channels)),off=new OfflineAudioContext(2,frames,fmt.rate),b=off.createBuffer(2,frames,fmt.rate);for(let i=0;i<frames;i++)for(let c=0;c<2;c++){const source=Math.min(c,fmt.channels-1),p=data.offset+(i*fmt.channels+source)*bytes;let x;if(fmt.format===3&&fmt.bits===32)x=v.getFloat32(p,true);else if(fmt.bits===16)x=v.getInt16(p,true)/32768;else if(fmt.bits===24){let q=v.getUint8(p)|(v.getUint8(p+1)<<8)|(v.getUint8(p+2)<<16);if(q&0x800000)q|=0xff000000;x=q/8388608;}else if(fmt.bits===32)x=v.getInt32(p,true)/2147483648;else throw Error("unsupported PCM");b.getChannelData(c)[i]=x;}return b;}
async function processBuffer(b){const p={trim:0,hpf:25,low:0,presence:0,high:0,threshold:-10,ratio:2,width:1,saturation:0,ceiling:-1},gain=d=>10**(d/20),off=new OfflineAudioContext(2,b.length,b.sampleRate),src=off.createBufferSource(),trim=off.createGain(),hpf=off.createBiquadFilter(),low=off.createBiquadFilter(),presence=off.createBiquadFilter(),high=off.createBiquadFilter(),comp=off.createDynamicsCompressor(),sat=off.createWaveShaper(),split=off.createChannelSplitter(2),merge=off.createChannelMerger(2),ll=off.createGain(),lr=off.createGain(),rl=off.createGain(),rr=off.createGain(),limit=off.createDynamicsCompressor(),ceiling=off.createGain();src.buffer=b;trim.gain.value=gain(p.trim);hpf.type="highpass";hpf.frequency.value=p.hpf;low.type="lowshelf";low.frequency.value=120;low.gain.value=p.low;presence.type="peaking";presence.frequency.value=3200;presence.Q.value=.7;presence.gain.value=p.presence;high.type="highshelf";high.frequency.value=9000;high.gain.value=p.high;comp.threshold.value=p.threshold;comp.ratio.value=p.ratio;comp.attack.value=.03;comp.release.value=.22;sat.curve=curve(p.saturation);sat.oversample="4x";const direct=(1+p.width)/2,cross=(1-p.width)/2;ll.gain.value=direct;rr.gain.value=direct;lr.gain.value=cross;rl.gain.value=cross;limit.threshold.value=p.ceiling-2;limit.ratio.value=20;limit.attack.value=.003;limit.release.value=.08;ceiling.gain.value=gain(p.ceiling);src.connect(trim).connect(hpf).connect(low).connect(presence).connect(high).connect(comp).connect(sat).connect(split);split.connect(ll,0);split.connect(lr,0);split.connect(rl,1);split.connect(rr,1);ll.connect(merge,0,0);rl.connect(merge,0,0);lr.connect(merge,0,1);rr.connect(merge,0,1);merge.connect(limit).connect(ceiling).connect(off.destination);src.start();return off.startRendering();}
(async()=>{try{const raw=await (await fetch(fixture)).arrayBuffer(),source=decodeWav(raw),master=await processBuffer(source);result.textContent=JSON.stringify({format:"navalha-master-objective-reference",version:1,fixture,source:metrics(source),master:metrics(master)});document.body.dataset.done="true";}catch(error){result.textContent=JSON.stringify({error:String(error?.stack||error)});document.body.dataset.done="error";}finally{clearInterval(keepAlive);}})();
</script>
